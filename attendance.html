<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Attendance</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .form-area {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }

        #studentName {
            flex: 1;
            padding: 14px;
            font-size: 16px;
            border: 2px solid #333;
            border-radius: 8px;
            outline: none;
        }

        #addBtn {
            padding: 14px 25px;
            background-color: #07101c;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
        }

        #addBtn:hover {
            background-color: #222;
        }

        h2 {
            font-size: 22px;
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        th {
            background-color: #05080c;
            color: white;
            padding: 15px;
            font-size: 16px;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #ddd;
            font-size: 16px;
        }

        tr:hover {
            background-color: #f5f5f5;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .form-area {
                flex-direction: column;
            }

            #addBtn {
                width: 100%;
            }

            table {
                font-size: 13px;
            }

            th,
            td {
                padding: 10px 5px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Class Attendance</h1>

        <div class="form-area">
            <input
                type="text"
                id="studentName"
                placeholder="Enter full name"
            >

            <button id="addBtn" onclick="addAttendance()">
                Add Attendance
            </button>
        </div>

        <h2>Attendance List</h2>

        <table>
            <thead>
                <tr>
                    <th>No.</th>
                    <th>Student Name</th>
                    <th>Time Recorded</th>
                </tr>
            </thead>

            <tbody id="attendanceList">
            </tbody>
        </table>

    </div>


    <script>

        let attendanceNumber = 0;

        function addAttendance() {

            const nameInput =
                document.getElementById("studentName");

            const name = nameInput.value.trim();

            
            if (name === "") {
                alert("Please enter the student's full name.");
                return;
            }

            attendanceNumber++;

            
            const now = new Date();

            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();

            
            const ampm = hours >= 12 ? "PM" : "AM";

            
            hours = hours % 12;

            if (hours === 0) {
                hours = 12;
            }

            
            minutes = String(minutes).padStart(2, "0");
            seconds = String(seconds).padStart(2, "0");

            const time =
                String(hours).padStart(2, "0") +
                ":" +
                minutes +
                ":" +
                seconds +
                " " +
                ampm;

            
            const tableBody =
                document.getElementById("attendanceList");

            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${attendanceNumber}</td>
                <td>${name}</td>
                <td>${time}</td>
            `;

            tableBody.appendChild(row);

            
            nameInput.value = "";

            
            nameInput.focus();
        }

    </script>

</body>
</html>
