<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | zbrn</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <div class="logo">zbrn</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="about.html">About Me</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="gallery.html">Gallery</a>
      <a href="contact.html" class="active">Contact</a>
    </div>
  </nav>

  <section>
    <h2 class="section-title">Get In Touch</h2>
    <p style="color:var(--text-dim); margin-bottom:2rem;">Want to connect? Send me a message!</p>
    
    <form id="contact-form">
      <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" required placeholder="Enter your name">
        <div class="error-msg" id="name-error">Please enter your name</div>
      </div>
      
      <div class="form-group">
        <label for="email">Your Email</label>
        <input type="email" id="email" required placeholder="your@email.com">
        <div class="error-msg" id="email-error">Enter a valid email</div>
      </div>
      
      <div class="form-group">
        <label for="subject">Subject</label>
        <input type="text" id="subject" required placeholder="Message subject">
        <div class="error-msg" id="subject-error">Please enter a subject</div>
      </div>
      
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" rows="5" required placeholder="Write your message..."></textarea>
        <div class="error-msg" id="message-error">Please write your message</div>
      </div>
      
      <button type="submit" class="btn btn-primary">Send Message</button>
    </form>
  </section>

  <footer>
    © 2026 zbrn — Information Technology. All rights reserved.
  </footer>

  <script src="script.js"></script>
</body>
</html>
